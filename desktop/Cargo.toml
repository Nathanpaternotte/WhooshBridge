[package]
name = "whoosh-bridge"
version = "0.1.0-alpha.4"
edition = "2021"
license = "GPL-3.0-only"
description = "A macOS bridge from MyWhoosh rides to Garmin Connect"
rust-version = "1.88"
default-run = "whoosh-bridge"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
security-framework = "3"
anyhow = "1"
chrono = "0.4"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wry = "=0.57.1"
tao = "=0.37.2"

[[bin]]
name = "whoosh-bridge"
path = "src/main.rs"

[[bin]]
name = "whoosh-web-login"
path = "src/bin/whoosh-web-login.rs"
