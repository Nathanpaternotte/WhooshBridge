name: Desktop checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Python dependencies
        run: python -m pip install -r desktop/requirements-test.txt
      - name: Formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - name: Rust tests
        run: cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path desktop/Cargo.toml --locked --all-targets -- -D warnings
      - name: Python bridge tests
        run: python -m unittest discover -s desktop/tests -v
      - name: Independent FIT decoding
        run: python desktop/tests/check_fit_identity.py
      - name: Web helper tests
        run: node --test desktop/tests/*.test.cjs
